name: JW U.S. Congregation Tracker

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: write

jobs:
  tracker:
    name: Collect and update tracker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect JW.org snapshot
        run: python tracker/collector.py

      - name: Archive snapshot
        run: python tracker/archive.py

      - name: Compare snapshots
        run: python tracker/diff.py

      - name: Build dashboard
        run: python tracker/dashboard.py

      - name: Commit updated tracker data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if git diff --cached --quiet; then
            echo 'No tracker changes to commit.'
          else
            git commit -m 'Update JW U.S. congregation snapshot'
            git push
          fi
